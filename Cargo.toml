[workspace]
resolver = "3"
members = [
    "crates/dss",
    "crates/agent",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
askama = "0.16.1"
axum = "0.8.9"
feed-rs = "3.0.0"
hashbrown = { version = "0.17.2", features = ["serde"] }
hex = "0.4.3"
html-escape = "0.3.1"
html2text = "0.17.4"
reqwest = { version = "0.13.5", features = ["json", "gzip", "deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde-well-known", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.2"
tower = { version = "0.5.3", features = ["limit", "timeout"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-appender = { version = "0.2.5", features = ["parking_lot"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

dss = { path = "crates/dss" }
web-agent = { path = "crates/agent" }
